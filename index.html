<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energiärenden — Länsstyrelsen Sverige</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background glows -->
  <div class="amb-glow g1"></div>
  <div class="amb-glow g2"></div>
  <div class="amb-glow g3"></div>

  <!-- Top navigation -->
  <nav class="topnav">
    <div class="brand">
      <div class="brand-mark">LST</div>
      <div class="brand-text">
        <span class="brand-name">Energiärenden</span>
        <span class="brand-sub">Länsstyrelsen Sverige</span>
      </div>
    </div>
    <div class="nav-right">
      <div class="nav-stats">
        <div class="nav-stat">
          <span class="nav-stat-val" id="navTotal">25</span>
          <span class="nav-stat-lbl">projekt</span>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-stat">
          <span class="nav-stat-val" id="navActive">—</span>
          <span class="nav-stat-lbl">pågående</span>
        </div>
      </div>
      <button class="settings-btn" onclick="toggleSettings()" title="Inställningar">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 1v2m0 14v2M1 10h2m14 0h2m-3.1-5.9l-1.4 1.4M5.5 14.5l-1.4 1.4m0-11.8l1.4 1.4m9.1 9.1l1.4 1.4"/></svg>
      </button>
    </div>
  </nav>

  <!-- App shell -->
  <div class="app-shell">

    <!-- ── LEFT: Search + Results ── -->
    <div class="search-col">

      <!-- Sticky search area -->
      <div class="search-area">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13 13l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input
            id="searchInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Sök plats, projekttyp, handläggare, sökande…"
          />
          <button class="clear-btn hidden" id="clearBtn" aria-label="Rensa">
            <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12">
              <path d="M8 8l3.5 3.5-1 1L7 9 3.5 12.5l-1-1L6 8 2.5 4.5l1-1L7 7l3.5-3.5 1 1z"/>
            </svg>
          </button>
        </div>

        <!-- Filter toggle button -->
        <button class="filter-toggle" id="filterToggle">
          <svg viewBox="0 0 20 20" fill="none" width="14" height="14">
            <path d="M2 4h16M5 10h10M8 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span>Filter</span>
          <span class="filter-badge hidden" id="filterBadge">0</span>
          <svg class="filter-chevron" viewBox="0 0 12 12" fill="none" width="10" height="10">
            <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Hemnet-style filter panel -->
        <div class="filter-panel hidden" id="filterPanel">

          <!-- Energityp (checkbox grid like Hemnet's Bostadstyp) -->
          <fieldset class="filter-group">
            <legend class="filter-label">Energityp</legend>
            <div class="filter-type-grid" id="typeGrid">
              <label class="type-option active" data-type="alla">
                <input type="checkbox" checked>
                <span class="type-dot" style="background: var(--accent)"></span>
                <span>Alla typer</span>
              </label>
              <label class="type-option" data-type="offshore">
                <input type="checkbox">
                <span class="type-dot" style="background: #60a5fa"></span>
                <span>Vind offshore</span>
              </label>
              <label class="type-option" data-type="onshore">
                <input type="checkbox">
                <span class="type-dot" style="background: #38bdf8"></span>
                <span>Vind onshore</span>
              </label>
              <label class="type-option" data-type="solkraft">
                <input type="checkbox">
                <span class="type-dot" style="background: #fbbf24"></span>
                <span>Solkraft</span>
              </label>
              <label class="type-option" data-type="vattenkraft">
                <input type="checkbox">
                <span class="type-dot" style="background: #34d399"></span>
                <span>Vattenkraft</span>
              </label>
              <label class="type-option" data-type="bioenergi">
                <input type="checkbox">
                <span class="type-dot" style="background: #a78bfa"></span>
                <span>Bioenergi</span>
              </label>
              <label class="type-option" data-type="batteri">
                <input type="checkbox">
                <span class="type-dot" style="background: #f472b6"></span>
                <span>Lagring</span>
              </label>
            </div>
          </fieldset>

          <!-- Kapacitet (MW) — min/max like Hemnet's Pris -->
          <fieldset class="filter-group">
            <legend class="filter-label">Kapacitet (MW)</legend>
            <div class="filter-range">
              <div class="filter-select-wrap">
                <select id="capMin" class="filter-select">
                  <option value="">Min</option>
                  <option value="1">1 MW</option>
                  <option value="5">5 MW</option>
                  <option value="10">10 MW</option>
                  <option value="25">25 MW</option>
                  <option value="50">50 MW</option>
                  <option value="100">100 MW</option>
                  <option value="200">200 MW</option>
                  <option value="500">500 MW</option>
                  <option value="1000">1 000 MW</option>
                </select>
              </div>
              <span class="filter-range-sep">—</span>
              <div class="filter-select-wrap">
                <select id="capMax" class="filter-select">
                  <option value="">Max</option>
                  <option value="5">5 MW</option>
                  <option value="10">10 MW</option>
                  <option value="25">25 MW</option>
                  <option value="50">50 MW</option>
                  <option value="100">100 MW</option>
                  <option value="200">200 MW</option>
                  <option value="500">500 MW</option>
                  <option value="1000">1 000 MW</option>
                  <option value="5000">5 000 MW</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- Län — dropdown like Hemnet's Område -->
          <fieldset class="filter-group">
            <legend class="filter-label">Län</legend>
            <div class="filter-select-wrap full">
              <select id="countyFilter" class="filter-select">
                <option value="">Alla län</option>
              </select>
            </div>
          </fieldset>

          <!-- Status -->
          <fieldset class="filter-group">
            <legend class="filter-label">Status</legend>
            <div class="filter-select-wrap full">
              <select id="statusFilter" class="filter-select">
                <option value="">Alla statusar</option>
                <option value="Under handläggning">Under handläggning</option>
                <option value="Beviljat">Beviljat</option>
                <option value="Avslutat">Avslutat</option>
                <option value="Överklagat">Överklagat</option>
                <option value="Avslaget">Avslaget</option>
              </select>
            </div>
          </fieldset>

          <!-- Action row -->
          <div class="filter-actions">
            <button class="filter-reset" id="filterReset">Rensa filter</button>
            <span class="filter-result-count" id="filterResultCount"></span>
          </div>
        </div>
      </div>

      <!-- Live data status -->
      <div class="live-status" id="liveStatus"></div>

      <!-- Results meta row -->
      <div class="results-meta" id="resultsMeta">
        <span id="resultsCount">25 projekt</span>
        <div class="sort-wrap">
          <label class="sort-label" for="sortSelect">Sortera på</label>
          <select id="sortSelect" class="sort-select">
            <option value="date">Nyast först</option>
            <option value="date-asc">Äldst först</option>
            <option value="capacity-desc">Störst kapacitet</option>
            <option value="capacity-asc">Minst kapacitet</option>
            <option value="county">Län A–Ö</option>
            <option value="name">Namn A–Ö</option>
          </select>
        </div>
      </div>

      <!-- Results list -->
      <ul class="results-list" id="resultsList" role="listbox" aria-label="Sökresultat">
        <!-- rendered by JS -->
      </ul>

    </div><!-- /search-col -->

    <!-- ── RIGHT: Detail panel ── -->
    <div class="detail-col" id="detailCol">

      <!-- Empty state -->
      <div class="detail-empty" id="detailEmpty">
        <div class="empty-visual">
          <svg viewBox="0 0 64 64" fill="none" width="64" height="64">
            <circle cx="32" cy="32" r="30" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
            <path d="M32 12v4M32 48v4M12 32h4M48 32h4" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="10" stroke="rgba(77,124,255,0.4)" stroke-width="1.5"/>
            <circle cx="32" cy="32" r="3" fill="rgba(77,124,255,0.6)"/>
            <!-- Turbine blades -->
            <path d="M32 22 Q35 27 32 29 Q29 27 32 22Z" fill="rgba(77,124,255,0.25)"/>
            <path d="M40 37 Q35 34 35 31 Q38 29 40 37Z" fill="rgba(77,124,255,0.25)"/>
            <path d="M24 37 Q29 34 29 31 Q26 29 24 37Z" fill="rgba(77,124,255,0.25)"/>
          </svg>
        </div>
        <h2>Välj ett projekt</h2>
        <p>Klicka på ett projekt i listan för att se fullständig information, ärendestatus och systemanalys.</p>
      </div>

      <!-- Project detail (hidden until selected) -->
      <article class="detail-panel hidden" id="detailPanel">
        <!-- rendered by JS -->
      </article>

    </div><!-- /detail-col -->

  </div><!-- /app-shell -->

  <!-- Settings panel -->
  <div class="settings-overlay hidden" id="settingsOverlay" onclick="toggleSettings()"></div>
  <div class="settings-panel hidden" id="settingsPanel">
    <div class="settings-header">
      <h3>Inställningar</h3>
      <button class="settings-close" onclick="toggleSettings()">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <label for="settingsEmail">E-postadress</label>
        <input type="email" id="settingsEmail" placeholder="namn@exempel.se" />
        <p class="settings-hint">Används som avsändare vid begäran om handlingar</p>
      </div>
      <div class="settings-group">
        <label for="settingsName">Namn</label>
        <input type="text" id="settingsName" placeholder="Förnamn Efternamn" />
      </div>
      <button class="settings-save" onclick="saveSettings()">Spara inställningar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
