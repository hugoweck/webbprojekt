<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Dashboard — BTC & Trump</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <!-- Background ambient glows -->
  <div class="ambient a1"></div>
  <div class="ambient a2"></div>
  <div class="ambient a3"></div>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-left">
      <span class="nav-logo">LIVE<span class="dot">.</span>DASH</span>
      <div class="live-pill">
        <span class="pulse-dot"></span>
        LIVE
      </div>
    </div>
    <div class="nav-right">
      <span class="nav-clock" id="navClock">--:--:--</span>
    </div>
  </nav>

  <!-- Main grid -->
  <main class="grid">

    <!-- ── BITCOIN PANEL ── -->
    <section class="panel btc-panel">

      <div class="panel-header">
        <div class="panel-icon btc-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M14.24 10.56c-.31 1.24-2.24.61-2.84.44l.55-2.18c.62.18 2.61.44 2.29 1.74zm-3 2.71c-.35 1.4-2.74.68-3.51.51l.6-2.41c.77.19 3.27.54 2.91 1.9zm8.76.51c-.45 1.79-1.63 3.05-3.27 3.67l-.4 1.58h-1.28l.39-1.54c-.34.09-.68.17-1.02.22l-.39 1.54h-1.28l.4-1.6c-.28.04-.56.05-.83.05H10.3l.3-1.44h.89c.45 0 .66-.19.72-.4l1.67-6.72c.06-.21 0-.42-.34-.42h-.87l.27-1.44h3.21c.88 0 1.62.11 2.17.44.55.33.86.82.71 1.59-.22 1.12-.82 1.72-1.65 2.07.98.27 1.59.86 1.39 2.03zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          </svg>
        </div>
        <div>
          <h2 class="panel-title">Bitcoin</h2>
          <p class="panel-sub">BTC / USD</p>
        </div>
        <div class="spacer"></div>
        <div class="refresh-info">
          Uppdateras om <span id="countdown">60</span>s
        </div>
      </div>

      <!-- Price hero -->
      <div class="price-hero">
        <div class="price-main" id="btcPrice">
          <span class="price-skeleton">Laddar…</span>
        </div>
        <div class="price-change" id="btcChange">—</div>
      </div>

      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">Market Cap</span>
          <span class="stat-value" id="btcMcap">—</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-label">Vol (24h)</span>
          <span class="stat-value" id="btcVol">—</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-label">High (24h)</span>
          <span class="stat-value" id="btcHigh">—</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-label">Low (24h)</span>
          <span class="stat-value" id="btcLow">—</span>
        </div>
      </div>

      <!-- Chart timeframe toggle -->
      <div class="timeframe-row">
        <button class="tf-btn active" data-days="1">24H</button>
        <button class="tf-btn" data-days="7">7D</button>
        <button class="tf-btn" data-days="30">30D</button>
        <button class="tf-btn" data-days="90">90D</button>
      </div>

      <!-- Chart -->
      <div class="chart-wrap">
        <canvas id="btcChart"></canvas>
        <div class="chart-overlay" id="chartOverlay">
          <div class="spinner"></div>
        </div>
      </div>

    </section>

    <!-- ── TRUMP TWEETS PANEL ── -->
    <section class="panel tweets-panel">

      <div class="panel-header">
        <div class="panel-icon twitter-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </div>
        <div>
          <h2 class="panel-title">Donald Trump</h2>
          <p class="panel-sub">@realDonaldTrump · senaste 5 posts</p>
        </div>
        <div class="spacer"></div>
        <div class="demo-badge">DEMO</div>
      </div>

      <!-- API note -->
      <div class="api-notice">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
        Twitter/X API kräver backend-server. Visar demo-data.
      </div>

      <!-- Tweet feed -->
      <div class="tweets-feed" id="tweetsFeed">
        <!-- rendered by JS -->
      </div>

    </section>

  </main>

  <script src="dashboard.js"></script>
</body>
</html>
